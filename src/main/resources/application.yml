spring:
  application:
    name: NoteHub Server
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:notehubDB}
    username: ${POSTGRES_USER:notehub}
    password: ${POSTGRES_PASSWORD:notehub_password}
  sql:
    init:
      mode: always
server:
  port: 8080


logging:
  level.org.springframework.r2dbc: DEBUG
  # Show the parameters being bound to the $1, $2, etc.
logging.level.io.r2dbc.postgresql: DEBUG
  # Specifically for the mapping logic
logging.level.org.springframework.data.r2dbc: DEBUG